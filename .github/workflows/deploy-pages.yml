name: Deploy Brave Blocks review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Praise Power-Up configuration
        run: pnpm praise:test
      - name: Build and audit generic profile
        env:
          NEXT_PUBLIC_BRAVE_BLOCKS_EDITION: CHILD
          NEXT_PUBLIC_BRAVE_BLOCKS_PROFILE: GENERIC
        run: |
          pnpm exec next build --webpack
          pnpm edition:finalize
          pnpm edition:audit
          pnpm offline:verify
          pnpm offline:test
      - name: Build and audit CHILD edition
        env:
          NEXT_PUBLIC_BRAVE_BLOCKS_EDITION: CHILD
          NEXT_PUBLIC_BRAVE_BLOCKS_PROFILE: MOSES
        run: |
          pnpm exec next build --webpack
          pnpm edition:finalize
          pnpm edition:audit
          pnpm offline:verify
          pnpm offline:test
      - name: Build REVIEW edition for deployment
        env:
          NEXT_PUBLIC_BRAVE_BLOCKS_EDITION: REVIEW
          NEXT_PUBLIC_BRAVE_BLOCKS_PROFILE: GENERIC
        run: |
          pnpm exec next build --webpack
          pnpm edition:finalize
          pnpm edition:audit
          pnpm offline:verify
          pnpm offline:test
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
